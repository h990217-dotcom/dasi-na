<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다시, 나 - 경력 포트폴리오</title>
    
    <!-- Google Fonts: Noto Sans KR 연결 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- 외부 스타일시트(CSS) 연결 -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- 헤더 영역: 로고 및 글로벌 네비게이션 -->
    <header>
        <div class="logo">
            <h1>다시, 나</h1>
        </div>
        <!-- 메인 메뉴 (네비게이션) -->
        <nav>
            <ul>
                <li><a href="#about">소개</a></li>
                <li><a href="#experience">경력</a></li>
                <li><a href="#skills">역량</a></li>
                <li><a href="#education">교육·자격</a></li>
                <li><a href="#contact">문의</a></li>
            </ul>
        </nav>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <main>
        
        <!-- 히어로/소개 섹션 -->
        <section id="about">
            <!-- 프로필 이미지 예시 (Placeholder) -->
            <img src="https://placehold.co/150x150?text=Profile" alt="김지은 프로필 이미지" width="150" height="150">
            <h2>안녕하세요, 김지은입니다.</h2>
            <p>10년 경력의 사무행정 전문가, 다시 시작합니다</p>
        </section>

        <!-- 경력 섹션 -->
        <section id="experience">
            <h2>경력</h2>
            <p>경력 사항이 들어갈 위치입니다.</p>
        </section>

        <!-- 역량 섹션 -->
        <section id="skills">
            <h2>역량</h2>
            <p>주요 보유 역량이 들어갈 위치입니다.</p>
        </section>

        <!-- 교육 및 자격증 섹션 -->
        <section id="education">
            <h2>교육·자격</h2>
            <p>이수 교육 및 보유 자격증 목록이 들어갈 위치입니다.</p>
        </section>

        <!-- 문의 섹션 -->
        <section id="contact">
            <h2>문의</h2>
            <p>연락처 및 이메일 문의 폼이 들어갈 위치입니다.</p>
        </section>

    </main>

    <!-- 푸터 영역: 저작권 표시 -->
    <footer>
        <p>&copy; 2026 김지은. All rights reserved.</p>
    </footer>

    <!-- 외부 자바스크립트(JS) 연결 -->
    <script src="js/script.js"></script>
</body>
</html>
